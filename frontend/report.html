<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 리포트 - TrackIn</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="./index.html">TrackIn</a></h1>
            <nav>
                <ul>
                    <li><a href="./index.html">홈</a></li>
                    <li><a href="./write.html">기록하기</a></li>
                    <li><a href="./report.html" class="active">리포트</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="report-section">
                <h2>AI 진로 탐색 리포트</h2>
                
                <!-- 안내 메시지 -->
                <div class="info-box" id="infoBox">
                    <p>리포트를 생성하기 위해서는 <strong>최소 5개 이상의 기록</strong>이 필요합니다.</p>
                    <p id="recordCountText">현재 <span id="recordCount">0</span>개의 기록이 있습니다.</p>
                    <p class="info-tip">💡 <strong>Tip:</strong> 기록이 많을수록 더 정확하고 구체적인 인사이트를 받을 수 있어요!</p>
                </div>

                <!-- 리포트 생성 버튼 -->
                <div class="button-group">
                    <button id="generateBtn" class="btn-primary" disabled>
                        AI 리포트 생성하기
                    </button>
                    <button id="loadBtn" class="btn-secondary">
                        최근 생성된 리포트 불러오기
                    </button>
                    <button id="deleteBtn" class="btn-danger">
                        리포트 삭제
                    </button>
                </div>

                <!-- 로딩 상태 -->
                <div id="loadingState" class="loading-state" style="display: none;">
                    <div class="spinner"></div>
                    <p>AI가 리포트를 생성하고 있습니다... (약 10-30초 소요)</p>
                </div>

                <!-- 에러 메시지 -->
                <div id="errorBox" class="error-box" style="display: none;"></div>

                <!-- 리포트 출력 영역 -->
                <div id="reportOutput" class="report-output" style="display: none;">
                    <h3>📊 진로 탐색 리포트</h3>
                    <div class="report-meta" id="reportMeta"></div>
                    <div class="report-content" id="reportContent"></div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 TrackIn. All rights reserved.</p>
            <p>일상 기록으로 시작하는 나만의 진로 탐색</p>
        </div>
    </footer>

    <script src="./app.js"></script>
</body>
</html>
