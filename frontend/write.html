<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록하기 - TrackIn</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="./index.html">TrackIn</a></h1>
            <nav>
                <ul>
                    <li><a href="./index.html">홈</a></li>
                    <li><a href="./write.html" class="active">기록하기</a></li>
                    <li><a href="./report.html">리포트</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="write-section">
                <h2>오늘의 일상 기록</h2>
                
                <!-- AI 질문 영역 -->
                <div class="ai-question-box" id="aiQuestionBox">
                    <h3>💬 AI가 제안하는 질문</h3>
                    <div id="aiQuestions" class="questions-list">
                        <p class="loading">질문을 불러오는 중...</p>
                    </div>
                    <button id="regenerateBtn" class="btn-secondary">새로운 질문 받기</button>
                </div>

                <!-- 기록 작성 폼 -->
                <form id="writeForm" class="write-form">
                    <div class="form-group">
                        <label for="recordDate">날짜 (선택사항)</label>
                        <input 
                            type="date" 
                            id="recordDate" 
                            name="recordDate"
                        >
                        <small class="form-hint">기본값은 오늘 날짜입니다. 과거 기록을 작성하려면 날짜를 선택하세요.</small>
                    </div>

                    <div class="form-group">
                        <label for="title">제목</label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            placeholder="오늘의 한 줄 요약"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="content">내용</label>
                        <textarea 
                            id="content" 
                            name="content" 
                            rows="10" 
                            placeholder="오늘 무엇을 했나요? 어떤 생각이 들었나요?&#10;AI 질문에 답하거나 자유롭게 작성해보세요."
                            required
                        ></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">저장하기</button>
                        <button type="button" id="clearBtn" class="btn-secondary">내용 지우기</button>
                    </div>
                </form>

                <!-- AI 응답 영역 -->
                <div id="aiResponseBox" class="ai-response-box" style="display: none;">
                    <h3>🤖 AI 상담사의 응답</h3>
                    <div id="aiResponse" class="ai-response-content"></div>
                </div>

                <!-- 최근 기록 목록 -->
                <div class="recent-records">
                    <h3>최근 기록 (<span id="recordsCount">0</span>)</h3>
                    <ul id="recordsList" class="records-list">
                        <li class="empty-state">아직 작성된 기록이 없습니다.</li>
                    </ul>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 TrackIn. All rights reserved.</p>
            <p>일상 기록으로 시작하는 나만의 진로 탐색</p>
        </div>
    </footer>

    <script src="./app.js"></script>
</body>
</html>
